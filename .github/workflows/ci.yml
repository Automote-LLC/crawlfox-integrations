name: CI

on:
  push:
    branches: [main, "pratik/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JS SDK
        run: |
          cd packages/js
          npm ci || npm install
          npm test
          npm run build
      - name: Python SDK
        run: |
          python -m pip install -e "packages/python[dev]"
          cd packages/python
          pytest -q
