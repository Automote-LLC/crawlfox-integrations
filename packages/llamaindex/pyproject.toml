[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlfox-llamaindex"
version = "0.1.0"
description = "LlamaIndex web reader for CrawlFox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
  "crawlfox-py>=0.1.0",
  "llama-index-core>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crawlfox_llamaindex"]
