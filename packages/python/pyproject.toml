[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlfox-py"
version = "0.1.0"
description = "Official Python SDK for CrawlFox: scrape pages, search Google, Bing, or DuckDuckGo, and batch URLs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Automote LLC" }]
keywords = ["crawlfox", "web-scraping", "serp", "markdown", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://crawlfox.io"
Documentation = "https://docs.crawlfox.io"
Repository = "https://github.com/Automote-LLC/crawlfox-integrations"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlfox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
