[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlfox-crewai"
version = "0.1.0"
description = "CrewAI tools for CrawlFox scrape and search"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
  "crawlfox-py>=0.1.0",
  "crewai-tools>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crawlfox_crewai"]
